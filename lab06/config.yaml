# Lab 6 - single config object that drives the whole training pipeline.
# Paths are relative to this lab06/ folder. Override any key from the CLI:
#   python train.py --set train.lr=0.01 data.batch_size=64 run_name=my-run
experiment: lab06-training-pipeline
run_name: cnn-baseline
seed: 42
model: cnn                 # best Lab 3 model (test acc 0.900): mlp | cnn | attention

data:
  root: ../lab03/data      # reuse the FashionMNIST download from Lab 3
  val_size: 5000
  batch_size: 128
  eval_batch_size: 512
  num_workers: 0
  persistent_workers: true

train:
  epochs: 10
  optimizer: adam          # adam | sgd
  lr: 0.001
  momentum: 0.9            # used by sgd only
  weight_decay: 0.0
  scheduler: none          # none | step | cosine | plateau
  step_size: 4             # StepLR
  gamma: 0.1               # StepLR
  plateau_factor: 0.3      # ReduceLROnPlateau
  plateau_patience: 1      # ReduceLROnPlateau
  accum_steps: 1           # gradient accumulation (effective batch = batch_size * accum_steps)

checkpoint:
  dir: checkpoints         # checkpoints/<run_name>/last.pt and best.pt

mlflow:
  tracking_uri: mlruns     # view with:  mlflow ui   (run from lab06/)
