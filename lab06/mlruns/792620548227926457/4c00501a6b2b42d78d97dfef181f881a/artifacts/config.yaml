experiment: lab06-training-pipeline
run_name: smoke
seed: 42
model: cnn
data:
  root: ../lab03/data
  val_size: 5000
  batch_size: 128
  eval_batch_size: 512
  num_workers: 0
  persistent_workers: true
train:
  epochs: 1
  optimizer: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0
  scheduler: none
  step_size: 4
  gamma: 0.1
  plateau_factor: 0.3
  plateau_patience: 1
  accum_steps: 1
checkpoint:
  dir: checkpoints
mlflow:
  tracking_uri: mlruns
